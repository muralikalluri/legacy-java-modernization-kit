# The strangler gateway. Migrated paths go to the Spring Boot app, everything else to the legacy app.
# SPEC routes /claims/search/**, but the real path is /claims/search.do, so it is matched exactly (see ADR 0004 and 0005).
upstream legacy_app {
  server legacy:8080;
  keepalive 16;
}

upstream modern_app {
  server modern:8080;
  keepalive 16;
}

server {
  listen 80;
  server_tokens off;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  # Pass the Host header exactly as the client sent it, port included: both apps build absolute URLs from it.
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  # Overwrite, never append: a client must not be able to choose the address the apps see.
  proxy_set_header X-Forwarded-For $remote_addr;
  # Clear everything a client could send to spoof the origin. Neither app is configured to trust forwarded headers, and
  # the gateway deliberately announces no protocol or port, so redirects stay relative.
  proxy_set_header X-Forwarded-Proto "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-Port "";
  proxy_set_header X-Forwarded-Prefix "";
  proxy_set_header Forwarded "";

  # ^~ keeps a regex location added later from taking these over. "/customers" without the slash is not a migrated path.
  location ^~ /customers/ {
    proxy_pass http://modern_app;
  }

  location = /claims/search.do {
    proxy_pass http://modern_app;
  }

  location / {
    proxy_pass http://legacy_app;
  }
}
