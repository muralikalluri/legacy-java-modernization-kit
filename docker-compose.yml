services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harbor}
      POSTGRES_USER: ${POSTGRES_USER:-harbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harbor} -d ${POSTGRES_DB:-harbor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  legacy:
    build: ./legacy-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LEGACY_PORT:-8081}:8080"

  modern:
    build: ./modern-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MODERN_PORT:-8082}:8080"

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - legacy
      - modern
    ports:
      - "${GATEWAY_PORT:-8080}:80"
