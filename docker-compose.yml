services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harbor}
      POSTGRES_USER: ${POSTGRES_USER:-harbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me-app-local}
    volumes:
      - ./legacy-app/db/00-app-role.sh:/docker-entrypoint-initdb.d/00-app-role.sh:ro
      - ./legacy-app/db/V1__schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./legacy-app/db/V2__seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
      - ./legacy-app/db/V3__m2_schema.sql:/docker-entrypoint-initdb.d/30-m2-schema.sql:ro
      - ./legacy-app/db/V4__grants.sql:/docker-entrypoint-initdb.d/40-grants.sql:ro
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    healthcheck:
      # TCP, not the socket: the temporary init server listens on the socket only, so this turns healthy after the init scripts ran
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-harbor} -d ${POSTGRES_DB:-harbor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  legacy:
    build: ./legacy-app
    environment:
      JAVA_OPTS: >-
        -Duser.timezone=UTC
        -Dharbor.jobs.enabled=${HARBOR_JOBS_ENABLED:-false}
        -Dharbor.db.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-harbor}
        -Dharbor.db.user=harbor_app
        -Dharbor.db.password=${APP_DB_PASSWORD:-change-me-app-local}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LEGACY_PORT:-8081}:8080"

  modern:
    build: ./modern-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MODERN_PORT:-8082}:8080"

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - legacy
      - modern
    ports:
      - "${GATEWAY_PORT:-8080}:80"
