name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  legacy-app:
    name: legacy-app (Java 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in a temurin-8 container
        run: |
          docker run --rm -v "$PWD/legacy-app":/src -w /src \
            maven:3.9-eclipse-temurin-8 mvn -B verify

  modern-app:
    name: modern-app (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f modern-app verify

  assess:
    name: assess (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Semgrep (runs offline with the local rules)
        run: pip install semgrep==1.176.0
      - name: Build the legacy app in a temurin-8 container (WAR and compiled classes for jdeps)
        run: |
          docker run --rm -v "$PWD/legacy-app":/src -w /src \
            maven:3.9-eclipse-temurin-8 mvn -B -q -DskipTests package
      - name: Unit tests
        run: mvn -B -f assess/pom.xml verify
      - name: Regenerate everything offline and compare with the committed results and deliverable
        run: |
          ./assess/run-all.sh --offline
          git diff --exit-code assess/results sample-deliverable
          test -z "$(git status --porcelain assess/results sample-deliverable)"
