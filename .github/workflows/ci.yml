name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  legacy-app:
    name: legacy-app (Java 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in a temurin-8 container
        run: |
          docker run --rm -v "$PWD/legacy-app":/src -w /src \
            maven:3.9-eclipse-temurin-8 mvn -B verify

  modern-app:
    name: modern-app (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f modern-app verify

  assess:
    name: assess (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Semgrep (runs offline with the local rules)
        run: pip install semgrep==1.176.0
      - name: Build the legacy app in a temurin-8 container (WAR and compiled classes for jdeps)
        run: |
          docker run --rm -v "$PWD/legacy-app":/src -w /src \
            maven:3.9-eclipse-temurin-8 mvn -B -q -DskipTests package
      - name: Unit tests
        run: mvn -B -f assess/pom.xml verify
      - name: Regenerate everything offline and compare with the committed results and deliverable
        run: |
          ./assess/run-all.sh --offline
          git diff --exit-code assess/results sample-deliverable README.md
          test -z "$(git status --porcelain assess/results sample-deliverable README.md)"

  characterization:
    name: characterization tests (legacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start PostgreSQL and the legacy app
        run: docker compose up -d --build postgres legacy
      - name: Run the suite, then run it again without a reset
        run: characterization-tests/run.sh --twice
      - name: Collect reports and logs on failure
        if: failure()
        run: |
          docker compose logs legacy > legacy.log || true
          docker compose logs postgres > postgres.log || true
      - name: Upload reports and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: characterization-diagnostics
          path: |
            characterization-tests/target/surefire-reports
            legacy.log
            postgres.log

  strangler:
    name: strangler (gateway with legacy and modern behind it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start PostgreSQL, the migrations, both apps and the gateway
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait until the whole stack answers through the gateway
        run: scripts/wait-ready.sh http://localhost:8080 180
      - name: Gateway smoke checks (routing, cookies, redirects, spoofed headers, logout)
        run: scripts/smoke-strangler.sh
      - name: The characterisation suite, unchanged, against the migrated routes (twice)
        run: characterization-tests/run.sh --target modern --base-url http://localhost:8080 --twice
      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs > stack.log || true
      - name: Upload reports and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strangler-diagnostics
          path: |
            characterization-tests/target/surefire-reports
            stack.log
